# ThreatMap Default Configuration

paths:
  raw_attack_dir: "data/raw"
  processed_attack_dir: "data/processed"
  artifacts_dir: "artifacts"
  evaluation_dir: "data/evaluation"
  samples_dir: "data/samples"
  attack_stix_url: "https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json"
  raw_attack_file: "data/raw/enterprise-attack.json"
  processed_attack_file: "data/processed/mitre_attack_enterprise.json"
  vector_index_file: "artifacts/vector_index.npy"
  index_metadata_file: "artifacts/index_metadata.json"
  bm25_index_file: "artifacts/bm25_index.pkl"

retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32
  top_k: 5
  rrf_k: 60
  hybrid_mode: "rrf" # 'rrf' or 'weighted'
  weighted_lexical_weight: 0.5
  weighted_semantic_weight: 0.5
  use_reranker: false
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

preprocessing:
  context_window_size: 1 # sentences before and after
  min_sentence_length: 5
  preserve_technical_tokens: true

classification:
  enabled: false # local LLM classification (fallback to retrieval-only if false or unreachable)
  provider: "ollama"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "llama3:8b"
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 30
  context_strategy: "target_with_context_and_candidates" # options: target_only, target_with_context, target_with_candidates, target_with_context_and_candidates

abstention:
  min_semantic_similarity: 0.30
  min_rrf_score: 0.012
  require_valid_attack_id: true
  min_evidence_char_length: 10
  verify_evidence_in_source: true

evaluation:
  benchmark_dataset: "data/evaluation/tram_benchmark.json"
  zero_division_strategy: 0.0
